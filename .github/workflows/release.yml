name: GenFlow signed release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare private signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.GENFLOW_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Set GenFlow signing secrets before release'; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/genflow.jks"
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile signed release
        working-directory: android
        env:
          GENFLOW_KEYSTORE: ${{ runner.temp }}/genflow.jks
          GENFLOW_STORE_PASSWORD: ${{ secrets.GENFLOW_STORE_PASSWORD }}
          GENFLOW_KEY_ALIAS: ${{ secrets.GENFLOW_KEY_ALIAS }}
          GENFLOW_KEY_PASSWORD: ${{ secrets.GENFLOW_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease :app:lintRelease
      - uses: actions/upload-artifact@v4
        with:
          name: GenFlow-Signed-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Remove ephemeral signing file
        if: always()
        run: rm -f "$RUNNER_TEMP/genflow.jks"
