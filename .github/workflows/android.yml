name: GenFlow Android and backend checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: genflow-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure Ubuntu package downloads
        run: bash .github/scripts/configure-apt.sh
      - name: Install media test dependencies
        timeout-minutes: 8
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Backend tests using explicitly synthetic fixtures
        run: |
          set -o pipefail
          PYTHONPATH=backend python -m unittest discover -s backend/tests -v 2>&1 | tee backend-tests.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GenFlow-backend-test-report
          path: backend-tests.txt
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile, lint and unit checks
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug :app:testDebugUnitTest
      - name: Verify and name development-signed APK
        run: |
          set -o pipefail
          cp android/app/build/outputs/apk/debug/app-debug.apk GenFlow.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs GenFlow.apk | tee GenFlow-apk-verification.txt
          sha256sum GenFlow.apk | tee GenFlow.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: GenFlow-Android-APK
          path: |
            GenFlow.apk
            GenFlow.apk.sha256
            GenFlow-apk-verification.txt
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GenFlow-Android-lint
          path: android/app/build/reports/
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build cloud runtime (does not deploy or test Google login)
        run: docker build -f deploy/Dockerfile -t genflow:ci .
  browser-adapter:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt
      - name: Configure Ubuntu package downloads
        run: bash .github/scripts/configure-apt.sh
      - run: python -m playwright install --with-deps chromium
        timeout-minutes: 10
      - name: Synthetic browser fixture (not a live Google Flow test)
        env:
          GENFLOW_TEST_CHROMIUM: auto
          PYTHONPATH: backend
        run: |
          set -o pipefail
          python -m unittest discover -s backend/tests -p test_browser_fixture.py -v 2>&1 | tee browser-fixture-tests.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GenFlow-synthetic-browser-test-report
          path: browser-fixture-tests.txt
