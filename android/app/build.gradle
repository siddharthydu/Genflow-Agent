plugins { id 'com.android.application' }
android {
    namespace 'app.genflow'
    compileSdk 35
    defaultConfig {
        applicationId 'app.genflow'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('GENFLOW_KEYSTORE')) {
                signingConfig signingConfigs.create('genflowRelease') {
                    storeFile file(System.getenv('GENFLOW_KEYSTORE'))
                    storePassword System.getenv('GENFLOW_STORE_PASSWORD')
                    keyAlias System.getenv('GENFLOW_KEY_ALIAS')
                    keyPassword System.getenv('GENFLOW_KEY_PASSWORD')
                }
            }
        }
    }
    lint { abortOnError true; checkReleaseBuilds true }
}
