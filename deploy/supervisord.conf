[supervisord]
nodaemon=true
logfile=/tmp/genflow-supervisor/supervisord.log
pidfile=/tmp/genflow-supervisor/supervisord.pid
childlogdir=/tmp/genflow-supervisor
[program:xvfb]
command=Xvfb :99 -screen 0 1440x900x24 -nolisten tcp
priority=10
autorestart=true
[program:fluxbox]
command=fluxbox
priority=20
autorestart=true
startretries=10
[program:vnc]
command=x11vnc -display :99 -localhost -rfbport 5900 -nopw -forever -shared
priority=30
autorestart=true
[program:novnc]
command=websockify --web=/usr/share/novnc 6080 127.0.0.1:5900
priority=40
autorestart=true
[program:browser]
command=python -m genflow.desktop
priority=50
autorestart=true
startretries=10
stopasgroup=true
killasgroup=true
[program:api]
command=python -m genflow.server
priority=60
autorestart=true
stopasgroup=true
killasgroup=true
[program:worker]
command=python -m genflow.worker
priority=70
autorestart=true
stopasgroup=true
killasgroup=true
